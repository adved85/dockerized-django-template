upstream django_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Served directly from the static_volume shared with the api container —
    # never proxied to gunicorn/Python.
    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# To terminate TLS here instead of at a load balancer:
#   1. mount real certs into this container (e.g. via a named volume or your
#      certificate provider's tooling — certbot, cloud-issued certs, etc.)
#   2. add a second `server { listen 443 ssl; ... }` block with
#      ssl_certificate / ssl_certificate_key pointing at them
#   3. uncomment the "443:443" port mapping for the nginx service in
#      docker-compose.prod.yml
# nginx does not obtain/renew certificates on its own — see docker/caddy/
# for a reverse-proxy option that does this automatically.
